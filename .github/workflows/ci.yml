name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]


jobs:
  gate:
    name: typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify:full

  archive-assets:
    name: archive assets reachable (CDN)
    runs-on: ubuntu-latest
    # Parallel with gate on purpose: scripts/verify-archive-assets.mjs needs
    # no install, no build and no browser — a checkout, Node, and ~80 HEAD
    # requests (about 10 seconds). The sampled default catches the wholesale
    # failures the script exists for (wrong base, unpopulated or emptied
    # bucket, access change); the exhaustive `--all` run stays a manual step
    # after an upload — see docs/operations.md.
    #
    # Same public base as the smoke job below, and scoped to this job for the
    # same reason: the gate job's tests assert the unset-variable fallback,
    # so it must never be set at workflow level.
    env:
      NEXT_PUBLIC_ARCHIVE_CDN: https://m70ph8nwojvanarn.public.blob.vercel-storage.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/verify-archive-assets.mjs "$NEXT_PUBLIC_ARCHIVE_CDN"

  smoke:
    name: route smoke test (headless Chromium)
    runs-on: ubuntu-latest
    needs: gate
    # Scoped to this job on purpose. NEXT_PUBLIC_ variables are inlined at
    # build time, so the smoke build needs this or the archive renderer falls
    # back to `/archive/…` — a gitignored dev symlink tree absent from a CI
    # checkout — and every record route logs a media 404.
    #
    # It must NOT be set for the gate job: tests/archive-content.test.ts
    # asserts that fallback, and setting it at workflow level made the gate
    # fail. The test now controls the variable itself, but the scope stays
    # narrow regardless — a test should not inherit deployment configuration.
    #
    # No secret. The Blob store is public and the base is in
    # docs/environment.md; anything private belongs in repository secrets.
    env:
      NEXT_PUBLIC_ARCHIVE_CDN: https://m70ph8nwojvanarn.public.blob.vercel-storage.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run start &
      - name: Wait for server
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/ > /dev/null && exit 0
            sleep 2
          done
          echo "Server never came up" >&2
          exit 1
      - run: node scripts/ci-smoke.mjs http://localhost:3000
