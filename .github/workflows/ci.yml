name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# NEXT_PUBLIC_ variables are inlined at build time, so this has to be set for
# `npm run build` and not only for the server. Without it the archive renderer
# falls back to `/archive/…`, which is a gitignored dev symlink tree that does
# not exist in a CI checkout — every record route then logs a media 404 and the
# smoke test fails on five routes.
#
# No secret: the Blob store is public and the base is already documented in
# docs/environment.md. Anything private belongs in repository secrets.
env:
  NEXT_PUBLIC_ARCHIVE_CDN: https://m70ph8nwojvanarn.public.blob.vercel-storage.com

jobs:
  gate:
    name: typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  smoke:
    name: route smoke test (headless Chromium)
    runs-on: ubuntu-latest
    needs: gate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run start &
      - name: Wait for server
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/ > /dev/null && exit 0
            sleep 2
          done
          echo "Server never came up" >&2
          exit 1
      - run: node scripts/ci-smoke.mjs http://localhost:3000
