name: Deliver editorial update

on:
  push:
    branches: [editorial-updates]
    # Packages are intentionally root-level. The same rule is enforced by
    # scripts/list-editorial-update-packages.ts after checkout.
    paths: ["editorial-updates/*.json"]

concurrency:
  group: editorial-update-delivery
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - name: Check out application tools from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: app

      - name: Check out this delivery package
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: packages
          # `github.event.before` can be older than one parent when a push
          # contains multiple commits, so the diff must have the full range.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install package validator
        working-directory: app
        run: npm ci

      - name: Validate, submit and poll each changed package serially
        working-directory: app
        env:
          EDITORIAL_UPDATE_INGEST_SECRET: ${{ secrets.EDITORIAL_UPDATE_INGEST_SECRET }}
          EDITORIAL_UPDATE_INGEST_BASE_URL: ${{ secrets.EDITORIAL_UPDATE_INGEST_BASE_URL }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          changed="$(node --import tsx scripts/list-editorial-update-packages.ts \
            --repository ../packages --before "$BEFORE" --sha "$SHA")"
          if [ -z "$changed" ]; then
            echo "::error title=No matching editorial package discovered::The push triggered for editorial-updates/*.json, but no canonical root-level package was found after checkout. Expected editorial-updates/YYYY-MM-DD-<runId>.json."
            echo "Changed paths observed by Git:"
            if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              git -C ../packages ls-files -- editorial-updates || true
            else
              git -C ../packages diff --name-only "$BEFORE" "$SHA" -- editorial-updates || true
            fi
            exit 1
          fi
          printf 'Detected canonical editorial package(s):\n%s\n' "$changed"
          while IFS= read -r package; do
            test -n "$package" || continue
            echo "::group::Validate $package"
            npm run editorial:publish -- "../packages/$package" --dry-run
            echo "::endgroup::"
            echo "::group::Deliver $package"
            npm run editorial:publish -- "../packages/$package"
            echo "::endgroup::"
          done <<EOF
          $changed
          EOF
