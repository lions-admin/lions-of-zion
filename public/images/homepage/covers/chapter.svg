<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <title>Editorial illustration for a chapter of the historical record</title>
  <defs>
    <linearGradient id="sGround" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#16171a"/><stop offset="0.6" stop-color="#0f1012"/><stop offset="1" stop-color="#08080a"/>
    </linearGradient>
    <linearGradient id="sHorizon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f6f3eb" stop-opacity="0.02"/>
      <stop offset="0.45" stop-color="#f6f3eb" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#f6f3eb" stop-opacity="0.02"/>
    </linearGradient>
    <radialGradient id="sSun" cx="0.5" cy="0.28" r="0.4">
      <stop offset="0" stop-color="#f0b429" stop-opacity="0.18"/><stop offset="1" stop-color="#f0b429" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#sGround)"/>
  <rect width="1600" height="1000" fill="url(#sSun)"/>

  <!-- Strata: a record laid down in layers, read from the bottom up. Each band
       is a period, not a dated event. -->
  <g fill="url(#sHorizon)">
    <path d="M0 396c260-52 470 30 730 4s430-84 870-30v58H0Z"/>
    <path d="M0 520c300-44 500 34 780 10s420-70 820-24v62H0Z"/>
    <path d="M0 648c240-38 520 28 800 6s440-58 800-18v66H0Z"/>
    <path d="M0 780c280-34 480 26 760 6s480-52 840-14v74H0Z"/>
  </g>
  <g stroke="#f6f3eb" stroke-opacity="0.14" fill="none">
    <path d="M0 396c260-52 470 30 730 4s430-84 870-30"/>
    <path d="M0 520c300-44 500 34 780 10s420-70 820-24"/>
    <path d="M0 648c240-38 520 28 800 6s440-58 800-18"/>
    <path d="M0 780c280-34 480 26 760 6s480-52 840-14"/>
  </g>

  <!-- The reading line: one vertical cut through every layer. -->
  <path d="M420 224V900" stroke="#f0b429" stroke-opacity="0.55" stroke-width="2"/>
  <g fill="#f0b429">
    <rect x="412" y="386" width="16" height="16" rx="2" fill-opacity="0.9"/>
    <rect x="412" y="512" width="16" height="16" rx="2" fill-opacity="0.7"/>
    <rect x="412" y="640" width="16" height="16" rx="2" fill-opacity="0.5"/>
    <rect x="412" y="772" width="16" height="16" rx="2" fill-opacity="0.35"/>
  </g>

  <g fill="#f6f3eb" fill-opacity="0.13">
    <rect x="472" y="386" width="180" height="9" rx="2"/>
    <rect x="472" y="512" width="240" height="9" rx="2"/>
    <rect x="472" y="640" width="150" height="9" rx="2"/>
    <rect x="472" y="772" width="206" height="9" rx="2"/>
  </g>

  <path d="M120 224H1480" stroke="#f6f3eb" stroke-opacity="0.16"/>
  <g fill="#f6f3eb" fill-opacity="0.10">
    <rect x="120" y="152" width="210" height="10" rx="2"/>
  </g>
</svg>
