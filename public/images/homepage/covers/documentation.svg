<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <title>Safe cover for preserved documentation that stays sealed</title>
  <defs>
    <linearGradient id="dGround" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#141517"/><stop offset="0.65" stop-color="#0d0e10"/><stop offset="1" stop-color="#08080a"/>
    </linearGradient>
    <linearGradient id="dFolder" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#f6f3eb" stop-opacity="0.16"/><stop offset="1" stop-color="#f6f3eb" stop-opacity="0.05"/>
    </linearGradient>
    <radialGradient id="dLamp" cx="0.5" cy="0.1" r="0.8">
      <stop offset="0" stop-color="#f6f3eb" stop-opacity="0.10"/><stop offset="1" stop-color="#f6f3eb" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#dGround)"/>
  <rect width="1600" height="1000" fill="url(#dLamp)"/>

  <!-- Stacked folders, closed. The contents are the point and they are not
       shown; the seal is the only thing the picture states. -->
  <g stroke="#f6f3eb" stroke-opacity="0.13">
    <rect x="332" y="252" width="900" height="560" rx="6" fill="#f6f3eb" fill-opacity="0.035"/>
    <rect x="368" y="286" width="864" height="526" rx="6" fill="#f6f3eb" fill-opacity="0.05"/>
  </g>
  <rect x="404" y="322" width="828" height="490" rx="6" fill="url(#dFolder)" stroke="#f6f3eb" stroke-opacity="0.22"/>
  <path d="M404 322H700L748 372H1232" stroke="#f6f3eb" stroke-opacity="0.22" fill="none"/>

  <g fill="#f6f3eb" fill-opacity="0.13">
    <rect x="452" y="424" width="330" height="10" rx="2"/>
    <rect x="452" y="458" width="470" height="7" rx="2"/>
    <rect x="452" y="484" width="400" height="7" rx="2"/>
    <rect x="452" y="510" width="446" height="7" rx="2"/>
  </g>

  <!-- The seal: one gold band across a closed file. -->
  <rect x="404" y="592" width="828" height="72" fill="#f0b429" fill-opacity="0.10"/>
  <path d="M404 592H1232M404 664H1232" stroke="#f0b429" stroke-opacity="0.42"/>
  <circle cx="818" cy="628" r="30" fill="#0b0b0b" stroke="#f0b429" stroke-opacity="0.75" stroke-width="2"/>
  <path d="M804 626v-9a14 14 0 0 1 28 0v9" fill="none" stroke="#f0b429" stroke-opacity="0.75" stroke-width="3"/>
  <rect x="800" y="626" width="36" height="24" rx="3" fill="#f0b429" fill-opacity="0.75"/>

  <g fill="#f6f3eb" fill-opacity="0.08">
    <rect x="452" y="708" width="220" height="7" rx="2"/>
    <rect x="700" y="708" width="150" height="7" rx="2"/>
    <rect x="878" y="708" width="190" height="7" rx="2"/>
  </g>

  <path d="M240 872H1360" stroke="#f6f3eb" stroke-opacity="0.10"/>
</svg>
