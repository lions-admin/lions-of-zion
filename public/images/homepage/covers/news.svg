<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <title>Editorial cover for reporting and analysis</title>
  <defs>
    <linearGradient id="nGround" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#16181d"/><stop offset="0.55" stop-color="#101216"/><stop offset="1" stop-color="#08090b"/>
    </linearGradient>
    <radialGradient id="nGlow" cx="0.22" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#f0b429" stop-opacity="0.16"/><stop offset="1" stop-color="#f0b429" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f6f3eb" stop-opacity="0.62"/><stop offset="1" stop-color="#f6f3eb" stop-opacity="0.08"/>
    </linearGradient>
    <pattern id="nGrid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0V80M0 80H80" stroke="#f6f3eb" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="1000" fill="url(#nGround)"/>
  <rect width="1600" height="1000" fill="url(#nGrid)"/>
  <rect width="1600" height="1000" fill="url(#nGlow)"/>

  <!-- Masthead rule and dateline ticks: a broadsheet reduced to its measure. -->
  <path d="M120 150H1480" stroke="#f6f3eb" stroke-opacity="0.28"/>
  <g stroke="#f6f3eb" stroke-opacity="0.22">
    <path d="M120 150V120M300 150V128M480 150V128M660 150V128M840 150V128M1020 150V128M1200 150V128M1380 150V128M1480 150V120"/>
  </g>

  <!-- The lead: three column blocks, the first weighted, the rest receding. -->
  <g fill="url(#nFade)">
    <rect x="120" y="238" width="660" height="26" rx="2"/>
    <rect x="120" y="292" width="560" height="26" rx="2"/>
    <rect x="120" y="346" width="420" height="26" rx="2"/>
  </g>

  <g fill="#f6f3eb" fill-opacity="0.13">
    <rect x="120" y="470" width="380" height="9" rx="2"/><rect x="120" y="500" width="380" height="9" rx="2"/>
    <rect x="120" y="530" width="380" height="9" rx="2"/><rect x="120" y="560" width="300" height="9" rx="2"/>
    <rect x="120" y="612" width="380" height="9" rx="2"/><rect x="120" y="642" width="340" height="9" rx="2"/>

    <rect x="560" y="470" width="380" height="9" rx="2"/><rect x="560" y="500" width="380" height="9" rx="2"/>
    <rect x="560" y="530" width="330" height="9" rx="2"/><rect x="560" y="582" width="380" height="9" rx="2"/>
    <rect x="560" y="612" width="380" height="9" rx="2"/><rect x="560" y="642" width="250" height="9" rx="2"/>

    <rect x="1000" y="470" width="380" height="9" rx="2"/><rect x="1000" y="500" width="300" height="9" rx="2"/>
    <rect x="1000" y="552" width="380" height="9" rx="2"/><rect x="1000" y="582" width="380" height="9" rx="2"/>
    <rect x="1000" y="612" width="200" height="9" rx="2"/>
  </g>

  <!-- Column gutters. -->
  <g stroke="#f6f3eb" stroke-opacity="0.09">
    <path d="M530 440V700M970 440V700"/>
  </g>

  <!-- The one accent: today's datum, drawn once. -->
  <path d="M120 782H1480" stroke="#f6f3eb" stroke-opacity="0.16"/>
  <path d="M120 782H612" stroke="#f0b429" stroke-width="3"/>
  <circle cx="612" cy="782" r="7" fill="#f0b429"/>

  <g fill="#f6f3eb" fill-opacity="0.10">
    <rect x="120" y="836" width="150" height="8" rx="2"/>
    <rect x="300" y="836" width="96" height="8" rx="2"/>
    <rect x="426" y="836" width="210" height="8" rx="2"/>
  </g>
</svg>
