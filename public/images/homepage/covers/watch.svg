    <path d="M296 500C420 500 470 668 596 668"/>
    <path d="M596 330C720 330 760 236 884 236"/>
    <path d="M596 330C720 330 760 356 884 356"/>
    <path d="M596 420C720 420 760 452 884 452"/>
    <path d="M596 580C720 580 760 548 884 548"/>
    <path d="M596 580C720 580 760 644 884 644"/>
    <path d="M596 668C720 668 760 764 884 764"/>
    <path d="M884 236C1010 236 1050 190 1176 190"/>
    <path d="M884 356C1010 356 1050 300 1176 300"/>
    <path d="M884 356C1010 356 1050 396 1176 396"/>
    <path d="M884 452C1010 452 1050 492 1176 492"/>
    <path d="M884 548C1010 548 1050 596 1176 596"/>
    <path d="M884 644C1010 644 1050 700 1176 700"/>
    <path d="M884 764C1010 764 1050 806 1176 806"/>
    <path d="M1176 190C1290 190 1330 160 1444 160"/>
