  <!-- The traced path of one claim, carried all the way across. -->
  <path d="M296 500C420 500 470 330 596 330C720 330 760 236 884 236C1010 236 1050 190 1176 190C1290 190 1330 160 1444 160"
        fill="none" stroke="url(#wThread)" stroke-width="3"/>

  <g fill="#f6f3eb">
    <g fill-opacity="0.30">
      <circle cx="596" cy="420" r="7"/><circle cx="596" cy="580" r="7"/><circle cx="596" cy="668" r="7"/>
      <circle cx="884" cy="356" r="6"/><circle cx="884" cy="452" r="6"/><circle cx="884" cy="548" r="6"/>
      <circle cx="884" cy="644" r="6"/><circle cx="884" cy="764" r="6"/>
