<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <title>Editorial illustration for a claim in circulation</title>
  <defs>
    <linearGradient id="wGround" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#15171a"/><stop offset="0.6" stop-color="#0e1012"/><stop offset="1" stop-color="#08090a"/>
    </linearGradient>
    <radialGradient id="wOrigin" cx="0.185" cy="0.5" r="0.42">
      <stop offset="0" stop-color="#f0b429" stop-opacity="0.28"/><stop offset="1" stop-color="#f0b429" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wThread" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f0b429" stop-opacity="0.9"/><stop offset="0.55" stop-color="#f0b429" stop-opacity="0.32"/><stop offset="1" stop-color="#f0b429" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="wEdge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f6f3eb" stop-opacity="0.34"/><stop offset="1" stop-color="#f6f3eb" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#wGround)"/>
  <rect width="1600" height="1000" fill="url(#wOrigin)"/>

  <!-- One claim on the left; repetition spreading right. Amplification is the
       only thing drawn here, so the accent belongs to the first utterance. -->
  <g fill="none" stroke="url(#wEdge)" stroke-width="1.5">
    <path d="M296 500C420 500 470 330 596 330"/>
    <path d="M296 500C420 500 470 420 596 420"/>
