      <circle cx="1176" cy="596" r="5"/><circle cx="1176" cy="700" r="5"/><circle cx="1176" cy="806" r="5"/>
    </g>
    <g fill-opacity="0.09">
      <circle cx="1444" cy="268" r="4"/><circle cx="1444" cy="376" r="4"/><circle cx="1444" cy="484" r="4"/>
      <circle cx="1444" cy="592" r="4"/><circle cx="1444" cy="700" r="4"/><circle cx="1444" cy="808" r="4"/>
